name: Verify install methods

# Exercises every install method the README documents, against the PUBLISHED
# release, on the platforms it targets. `install_methods` in ci.yml smoke-tests
# local packaging before a release exists; this one runs what a user runs.
#
# Homebrew and mise legs resolve the newest published release, so they only
# honor `tag` indirectly — run them after `release_brew` has pushed the formula.

on:
   workflow_dispatch:
      inputs:
         tag:
            description: "Release tag to install (default: latest)"
            type: string
   release:
      types: [published]

permissions:
   contents: read

env:
   TAG: ${{ inputs.tag }}

jobs:
   install_sh:
      name: "install.sh: ${{ matrix.os }}"
      strategy:
         fail-fast: false
         matrix:
            os: [ubuntu-22.04, ubuntu-24.04-arm, macos-14, macos-15-intel]
      runs-on: ${{ matrix.os }}
      steps:
         - name: curl install.sh | sh
           run: |
              set -euo pipefail
              curl -fsSL "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/scripts/install.sh" \
                | sh -s -- ${TAG:+--ref "$TAG"}
         - name: Run the installed binary
           run: |
              set -euo pipefail
              "$HOME/.local/bin/oms" --version
              "$HOME/.local/bin/oms" --smoke-test

   install_sh_musl:
      name: "install.sh: alpine (musl)"
      runs-on: ubuntu-22.04
      container: alpine:3.22
      steps:
         # curl is what the installer runs on; libstdc++/libgcc are what the
         # musl binary links against and what the README tells Alpine users to
         # install. Missing them is the failure the installer's smoke check
         # exists to catch, so this leg would fail loudly rather than silently.
         - name: Install prerequisites
           run: apk add --no-cache curl libstdc++ libgcc
         - name: curl install.sh | sh
           run: |
              set -eu
              curl -fsSL "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/scripts/install.sh" \
                | sh -s -- ${TAG:+--ref "$TAG"}
         - name: Run the installed binary
           run: |
              set -eu
              "$HOME/.local/bin/oms" --version
              "$HOME/.local/bin/oms" --smoke-test

   install_ps1:
      name: "install.ps1: windows"
      runs-on: windows-latest
      steps:
         - name: irm install.ps1 | iex
           shell: pwsh
           run: |
              $ErrorActionPreference = "Stop"
              $script = irm "https://raw.githubusercontent.com/$env:GITHUB_REPOSITORY/main/scripts/install.ps1"
              if ($env:TAG) {
                & ([scriptblock]::Create($script)) -Ref $env:TAG
              } else {
                & ([scriptblock]::Create($script))
              }
         - name: Run the installed binary
           shell: pwsh
           run: |
              $ErrorActionPreference = "Stop"
              & "$env:LOCALAPPDATA\oms\oms.exe" --version
              & "$env:LOCALAPPDATA\oms\oms.exe" --smoke-test

   homebrew:
      name: "brew: ${{ matrix.os }}"
      strategy:
         fail-fast: false
         matrix:
            os: [macos-14, macos-15-intel]
      runs-on: ${{ matrix.os }}
      steps:
         - name: brew install pickpocket/tap/oms
           run: brew install pickpocket/tap/oms
         - name: Run the installed binary
           run: |
              set -euo pipefail
              oms --version
              oms --smoke-test

   mise:
      name: "mise: ${{ matrix.os }}"
      strategy:
         fail-fast: false
         matrix:
            os: [ubuntu-22.04, macos-14]
      runs-on: ${{ matrix.os }}
      env:
         # mise's `minimum_release_age` defaults to 24h, so a release published
         # minutes ago is refused with "no versions found matching date filter".
         # That delay is mise's global supply-chain default for every tool, not
         # something oms controls — waive it so this job can verify the release
         # it was triggered by. Users installing a day-old release never see it.
         MISE_MINIMUM_RELEASE_AGE: 0s
         # Runner IPs are shared; an unauthenticated release list gets
         # rate-limited. A real user's machine does not need this.
         GITHUB_TOKEN: ${{ github.token }}
      steps:
         - name: Install mise
           run: curl -fsSL https://mise.run | sh
         - name: mise use -g github:pickpocket/oh-my-soup
           run: |
              set -euo pipefail
              export PATH="$HOME/.local/bin:$PATH"
              mise use -g "github:${GITHUB_REPOSITORY}"
         # The asset is `oms-<os>-<arch>`; mise strips the platform tokens and
         # installs it as `oms`. A rename regression surfaces here as a missing
         # binary, not as a broken one.
         - name: Run the installed binary
           run: |
              set -euo pipefail
              export PATH="$HOME/.local/bin:$PATH"
              mise exec -- oms --version
              mise exec -- oms --smoke-test
